[server]
sslCertFile = ".ssl/cert.pem"
sslKeyFile  = ".ssl/key.pem"

[client]
# Remove the native "⋮" app menu entirely (Deploy, Rerun, Settings, About,
# ...) — the top bar's own sun/moon toggle (uvalu/shell.py) replaces the
# menu's Settings > Theme picker, so nothing in it is load-bearing anymore.
toolbarMode = "minimal"

# Brand theming — light and dark variants are rendered natively by Streamlit.
# The active variant defaults to the user's system preference and can be
# switched via the top bar's sun/moon toggle (uvalu/shell.py); Streamlit
# resolves it through st.context.theme the same way either way.

[theme.light]
primaryColor             = "#1A8C6E"
backgroundColor          = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor                = "#0D1F3C"
borderColor              = "#E5E7EB"
linkColor                = "#1A8C6E"
codeBackgroundColor      = "transparent"
font                     = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif"
codeFont                 = "\"SF Mono\", \"Fira Code\", \"Cascadia Code\", monospace"

[theme.dark]
primaryColor             = "#1DD6A4"
backgroundColor          = "#0D1F3C"
secondaryBackgroundColor = "#0F2647"
textColor                = "#F5F7FA"
borderColor              = "#22334E"
linkColor                = "#1DD6A4"
codeBackgroundColor      = "transparent"
font                     = "-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif"
codeFont                 = "\"SF Mono\", \"Fira Code\", \"Cascadia Code\", monospace"
