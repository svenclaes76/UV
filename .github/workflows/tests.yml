# Full test suite (tests/) on every push and PR.
# Needs no .env, secrets or network: tests set their own ENCRYPTION_KEY and stub
# market-data and auth lookups.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: pytest
        run: python -m pytest -q
