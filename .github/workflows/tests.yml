# Full test suite (tests/) on pushes to master and on PRs; run it by hand on any
# other branch from the Actions tab (Run workflow). Docs-only changes skip it,
# and a newer push cancels the run still going for the same branch — the repo
# is private, so every run spends Actions minutes.
# Needs no .env, secrets or network: tests set their own ENCRYPTION_KEY and stub
# market-data and auth lookups.
name: tests

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Stamp build metadata (VM-04/VM-05)
        run: python tools/stamp_build.py --env test && python tools/stamp_build.py --check
      - name: pytest
        run: python -m pytest -q
